name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-manuals:
    name: Build Manuals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markpublish

      - name: Build PDF manuals
        run: python scripts/build_manuals.py

      - name: Upload PDF manuals artifact
        uses: actions/upload-artifact@v4
        with:
          name: brand-kit-manuals
          path: src/docs/manual/*.pdf
          if-no-files-found: error

