# markpublish.yaml
#
# Handbuch zum Brand Kit Generator, deutsche Fassung.
#
# Bauen, aus diesem Verzeichnis heraus:
#
#   markpublish build -o ../../../src/docs/manual/brand_kit_generator_de.pdf
#
# Das Ziel ist Absicht: die Anwendung liefert das PDF selbst aus und verlinkt es
# unten links. Der Dateiname traegt das Sprachkuerzel, damit weitere Fassungen
# daneben liegen koennen. Ohne -o entstuende brand_kit_generator.pdf neben den
# Quellen - das waere ein zweites, veraltendes Exemplar.
#
# Alle Schlüssel im Überblick: markpublish cheatsheet

