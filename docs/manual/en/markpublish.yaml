# markpublish.yaml
#
# Manual for the Brand Kit Generator, English edition.
#
# Build, from this directory:
#
#   markpublish build -o ../../../src/docs/manual/brand_kit_generator_en.pdf
#
# The target is deliberate: the app serves the PDF itself and links it in the
# bottom left, following the interface language. The file name carries the
# language code so the other editions can sit beside it. Without -o the build
# would drop brand_kit_generator.pdf next to the sources - a second copy that
# quietly goes stale.
#
# Every key at a glance: markpublish cheatsheet

document:
  title: "Brand Kit Generator"
  subtitle: "Creating transparent overlays for social media"
  author: "Frank Winter"
  version: "1.1.1"
  status: "Released"
  date: "auto"
  copyright: "© 2026 WASDCAT Games"
  language: "en"
  cover: true

  document_toc: 2
  part_toc: 1
  chapter_toc: 2

theme: "wasdcat"

parts:
  - part: "Getting started"
    break_before: "divider"
    chapters:
      - file: "01-overview.md"
        break_before: "page"
        show_title: true
      - file: "02-first-steps.md"
        break_before: "page"
        show_title: true
      - file: "03-interface.md"
        break_before: "page"
        show_title: true

  - part: "Working"
